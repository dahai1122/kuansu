name: Daily Memory Update

on:
  push:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

jobs:
  update-memory:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4

      - name: Run scripts
        run: |
          python scripts/hot_trending.py >> memory.md

      - name: Commit and Push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add memory.md
          git commit -m "Auto-update" || exit 0
          git push

      - name: Send Telegram Notification
        run: |
          curl -s -X POST https://telegram.org{{ secrets.TG_BOT_TOKEN }}/sendMessage \
            -d chat_id=${{ secrets.TG_CHAT_ID }} \
            -d text="🚀 报告主公：今日 GitHub 热榜已更新到 memory.md！请查阅。"
